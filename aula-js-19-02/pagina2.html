<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var valor = Number(prompt('Digite um valor'));
        if (valor >= 50) {
            document.write('Numero maior que 50 ' + valor);
        } else {
            document.write('Numero menor que 50 ' + valor);
        }
    </script>
</body>
</html>
